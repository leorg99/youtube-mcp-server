name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Test the packed runtime with production dependencies
        run: |
          archive=$(npm pack --ignore-scripts --silent)
          runtime=$(mktemp -d)
          npm install --prefix "$runtime" --ignore-scripts --omit=dev --no-audit --no-fund "./$archive"
          package="$runtime/node_modules/@coyasong/youtube-mcp-server"
          cp -R tests "$package/tests"
          cd "$package"
          rm tests/metadata.test.mjs
          node --test tests/*.test.mjs
      - run: npm audit --audit-level=high

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mcpb
